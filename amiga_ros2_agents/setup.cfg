[develop]
script_dir=$base/lib/amiga_ros2_agents
[install]
install_scripts=$base/lib/amiga_ros2_agents
[build_scripts]
executable = /usr/bin/env python3

[tool:pytest]
# scripts/ is manual scenario harnesses driven by hand against a live model, not
# a test suite. Their files are named test_*.py, so without this colcon collects
# them, tries to instantiate their classes and prints warnings for every one.
testpaths = test
